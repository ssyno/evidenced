name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
      - run: go test -race ./...
      - run: make build-all
      - uses: actions/upload-artifact@v4
        with:
          name: evidenced-binaries
          path: bin/
