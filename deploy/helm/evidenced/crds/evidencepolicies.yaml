apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: evidencepolicies.evidenced.io
spec:
  group: evidenced.io
  scope: Cluster
  names:
    kind: EvidencePolicy
    listKind: EvidencePolicyList
    plural: evidencepolicies
    singular: evidencepolicy
    shortNames: [evp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Records
          type: integer
          jsonPath: .status.records
        - name: LastRun
          type: date
          jsonPath: .status.lastRunTime
        - name: Error
          type: string
          jsonPath: .status.lastError
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [collectors]
              properties:
                interval:
                  type: string
                  description: Interval between collection cycles (Go duration, min 1m, default 1h).
                storePath:
                  type: string
                storeRotateAfter:
                  type: string
                  description: Chain rotation age (Go duration, min 24h, default 720h).
                exportDir:
                  type: string
                signingKeyPath:
                  type: string
                push:
                  type: object
                  required: [url]
                  description: >-
                    Opt-in upload of exported bundles to an evidenced portal.
                    The token is read from an env var or mounted file, never
                    from this resource.
                  properties:
                    url:
                      type: string
                    tokenEnv:
                      type: string
                    tokenFile:
                      type: string
                    agent:
                      type: string
                    caFile:
                      type: string
                collectors:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        enum: [tlsscan, certlifecycle, rbacposture, provenance, hostposture, cloudconfig]
                      settings:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                lastRunTime:
                  type: string
                  format: date-time
                records:
                  type: integer
                lastBundle:
                  type: string
                lastError:
                  type: string
