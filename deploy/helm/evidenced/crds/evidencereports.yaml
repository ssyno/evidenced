apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: evidencereports.evidenced.io
spec:
  group: evidenced.io
  scope: Cluster
  names:
    kind: EvidenceReport
    listKind: EvidenceReportList
    plural: evidencereports
    singular: evidencereport
    shortNames: [evr]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Policy
          type: string
          jsonPath: .spec.policyName
        - name: Records
          type: integer
          jsonPath: .spec.recordCount
        - name: Generated
          type: date
          jsonPath: .spec.generatedAt
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [policyName, generatedAt, bundlePath, recordCount, framework]
              properties:
                policyName:
                  type: string
                generatedAt:
                  type: string
                  format: date-time
                bundlePath:
                  type: string
                recordCount:
                  type: integer
                framework:
                  type: string
