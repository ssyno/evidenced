apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "evidenced.fullname" . }}-store
  namespace: {{ .Release.Namespace }}
  labels: {{- include "evidenced.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.size }}
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evidenced.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "evidenced.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate   # single writer of the evidence store
  selector:
    matchLabels:
      app.kubernetes.io/name: evidenced
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "evidenced.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "evidenced.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evidenced
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - operator
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          volumeMounts:
            - name: store
              mountPath: /var/lib/evidenced
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: {{ include "evidenced.fullname" . }}-store
