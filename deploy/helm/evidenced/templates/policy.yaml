{{- if .Values.policy.create }}
apiVersion: evidenced.io/v1alpha1
kind: EvidencePolicy
metadata:
  name: {{ .Values.policy.name }}
  labels: {{- include "evidenced.labels" . | nindent 4 }}
spec:
  interval: {{ .Values.policy.interval }}
  {{- if .Values.policy.signing.enabled }}
  signingKeyPath: /var/lib/evidenced/signing.pem
  {{- end }}
  {{- if .Values.policy.push.enabled }}
  push:
    url: {{ required "policy.push.url is required when push is enabled" .Values.policy.push.url }}
    tokenEnv: EVIDENCED_PUSH_TOKEN
    {{- with .Values.policy.push.agent }}
    agent: {{ . }}
    {{- end }}
    {{- if .Values.policy.push.caSecret }}
    caFile: /etc/evidenced/portal-ca/ca.crt
    {{- end }}
  {{- end }}
  collectors:
    {{- if .Values.policy.collectors.certlifecycle.enabled }}
    - name: certlifecycle
    {{- end }}
    {{- if .Values.policy.collectors.rbacposture.enabled }}
    - name: rbacposture
    {{- end }}
    {{- if .Values.policy.collectors.provenance.enabled }}
    - name: provenance
    {{- end }}
    {{- if .Values.policy.collectors.tlsscan.enabled }}
    - name: tlsscan
      settings:
        endpoints: {{- toYaml .Values.policy.collectors.tlsscan.endpoints | nindent 10 }}
    {{- end }}
{{- end }}
