image:
  repository: ghcr.io/ssyno/evidenced
  tag: ""            # defaults to appVersion
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Evidence store and bundles live here; keep it persistent.
storage:
  size: 1Gi
  storageClassName: ""

leaderElection:
  enabled: false

# Creates a default EvidencePolicy. Disable to manage policies yourself.
policy:
  create: true
  name: default
  interval: 1h
  signing:
    enabled: true
  # Opt-in upload of each bundle to an evidenced portal. The token is
  # read from a Secret; it never appears in the CR.
  push:
    enabled: false
    url: ""                # e.g. https://portal.example.com
    agent: ""              # defaults to the pod hostname
    existingSecret: ""     # Secret with key "token" holding the API token
    # Secret with key "ca.crt" to trust a private CA for the portal TLS.
    caSecret: ""
  collectors:
    certlifecycle:
      enabled: true
    rbacposture:
      enabled: true
    provenance:
      enabled: true
    tlsscan:
      enabled: false
      # endpoints: ["example.com:443"]
      endpoints: []
